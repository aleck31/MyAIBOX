apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-aibox
  labels:
    app: my-aibox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-aibox
  template:
    metadata:
      labels:
        app: my-aibox
    spec:
      serviceAccountName: my-aibox-sa
      containers:
      - name: my-aibox
        image: 222829864634.dkr.ecr.ap-southeast-1.amazonaws.com/my-aibox:latest
        ports:
        - containerPort: 8080
        env:
        - name: AWS_DEFAULT_REGION
          value: "ap-southeast-1"
        envFrom:
        - configMapRef:
            name: my-aibox-config
        - secretRef:
            name: my-aibox-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: my-aibox-service
spec:
  selector:
    app: my-aibox
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-aibox-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222829864634:role/MyAIBoxPodRole
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-aibox-config
data:
  AWS_REGION: "ap-southeast-1"
  SETTING_TABLE: "aibox_setting"
  SESSION_TABLE: "aibox_session"
  RETENTION_DAYS: "90"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  DEBUG: "False"
  SSL_ENABLED: "False"
  # CORS_ORIGINS: unset = same-origin only (the SPA is served by this app). "*" is rejected at
  # startup because the app uses credentialed cookies; list explicit origins if you need CORS.
  # CORS_ORIGINS: "https://aibox.example.com"
  # Myners SSO instead of Cognito password login (see .env.example):
  # SSO_ENABLED: "true"
  # SSO_AUTH_ORIGIN: "https://auth.myners.net"
  # SSO_COOKIE_NAME: "myners_sid"
  CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_HEADERS: "*"
  BEDROCK_REGION: "us-west-2"
  LOG_LEVEL: "INFO"
  LOG_TO_FILE: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-aibox-secrets
type: Opaque
stringData:
  # Plain text here; Kubernetes encodes it. Don't commit real values.
  USER_POOL_ID: ap-southeast-1_WBHlZF1Zf
  CLIENT_ID: 14j2pfhvqivg3sltslcc9dpo0f
  # REQUIRED: the app refuses to start with an unset/known-default key. Generate with:
  #   python -c 'import secrets; print(secrets.token_urlsafe(48))'
  SECRET_KEY: REPLACE_WITH_RANDOM_48_BYTE_TOKEN
  TOKEN_EXPIRATION: "36000"
  GEMINI_SECRET_ID: dev_gemini_api
  # Cognito `sub`s allowed to change MCP servers. Leave empty and adding stdio MCP
  # servers (host commands) is refused; any value makes ALL MCP changes admin-only.
  ADMIN_SUBS: ""
