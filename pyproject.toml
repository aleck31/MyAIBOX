[project]
name = "my-aibox"
version = "3.9.3"
description = "MyAIBOX(AI百宝箱) - A comprehensive Gen-AI application suite built with FastAPI and React"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Fundamental
    "fastapi>=0.143.0",
    "boto3>=1.43.111",
    "google-genai>=2.29.0",
    "openai>=3.28",
    # Strands Agents
    "strands-agents>=1.59",
    "strands-agents-tools>=0.8.9",
    "mcp>=2.1",
    # Utilities
    "uvicorn[standard]>=0.23.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.1.2",
    "cachetools>=5.3.0",
    "aiohttp>=3.8.5",
    "wikipedia>=1.4.0",
    "ddgs>=9.6.0",
    "ag-ui-protocol>=1.0.0",
    "aws-sdk-transcribe-streaming[awscrt]>=0.12.0",
    "aws-sdk-bedrock-runtime[awscrt]>=0.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
my-aibox = "backend.common.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*", "logs*", "tmp*", ".deprecated*"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
exclude = [".deprecated"]

[tool.ruff.lint]
# Pin the classic default rule set: ruff 0.17 widened its defaults (938 new findings).
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E701"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that hit real external services (AWS, LLMs, Wikipedia). Excluded by default.",
]
